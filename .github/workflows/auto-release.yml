name: Auto Release

on:
  workflow_dispatch:
    inputs:
      release_authorized:
        description: "Confirm explicit owner authorization to create a release and publish to npm."
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Create release for new version
    if: github.ref == 'refs/heads/main' && inputs.release_authorized == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for version bump
        id: check
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TAG="v${CURRENT_VERSION}"
          PREVIOUS_TAG=$(node .github/scripts/latest-stable-tag.mjs)

          if [ -n "$PREVIOUS_TAG" ] && ! git cat-file -e "${PREVIOUS_TAG}:package.json" 2>/dev/null; then
            echo "The latest release tag has no package.json; skipping release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            PREVIOUS_VERSION=$(git show "${PREVIOUS_TAG}:package.json" | node -e "let input=''; process.stdin.on('data', c => input += c); process.stdin.on('end', () => console.log(JSON.parse(input).version || ''));")
          else
            PREVIOUS_VERSION=""
          fi

          if [ -n "$PREVIOUS_VERSION" ] && [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "package.json version did not change (${CURRENT_VERSION}); skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git tag -l "$TAG" | grep -qx "$TAG"; then
            echo "Tag $TAG already exists; skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$PREVIOUS_VERSION" ]; then
            echo "Version bump detected since ${PREVIOUS_TAG}: ${PREVIOUS_VERSION} -> ${CURRENT_VERSION}."
          else
            echo "No previous release tag exists; explicit authorization permits the initial release."
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.check.outputs.released == 'true'
        shell: bash
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          PREV_TAG=$(node .github/scripts/latest-stable-tag.mjs)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(printf 'Released %s.\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s' "$TAG" "${{ github.repository }}" "$PREV_TAG" "$TAG")
          else
            NOTES="Released ${TAG}."
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger publish workflow
        if: steps.check.outputs.released == 'true'
        shell: bash
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          gh workflow run publish.yml --ref "$TAG" -f ref="$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
